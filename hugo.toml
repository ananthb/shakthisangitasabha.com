baseURL = "https://shakthisangitasabha.com/"
languageCode = "en-in"
title = "Shakthi Sangita Sabha"
enableRobotsTXT = true
theme = "github.com/ananthb/mandapam-theme"

# Programmes are dated in the future; taxonomies have no templates.
buildFuture = true
disableKinds = ["taxonomy", "term"]

[module]
[[module.imports]]
path = "github.com/ananthb/mandapam-theme"

[params]
logo = "logos/shakthi-sangita-sabha-logo.jpg"
hero_eyebrow = "சக்தி சங்கீத சபா · வளசரவாக்கம்"
hero_cta = "Enquire on WhatsApp"
hero_button = "See the programmes"
hero_button_link = "/events/"
whatsapp_message = "Hi, I'd like to enquire about a programme at Shakthi Sangita Sabha on "
services_kicker = "On our stage"
services_heading = "What we host"
moments_kicker = "Events"
moments_heading = "Recent events"
moments_all = "All events"
upcoming_kicker = "Coming up"
upcoming_heading = "Upcoming programmes"

# A deeper maroon than the theme default.
[params.theme]
primary = "#5e0713"
primary_deep = "#2b050b"
accent = "#c9a227"

[[params.facts]]
value = "150"
label = "theatre seats"
[[params.facts]]
value = "6"
label = "hi-fi speakers, tuned acoustics"
[[params.facts]]
value = "HD"
label = "recording and live streaming"
[[params.facts]]
value = "2nd"
label = "floor of Shakthi Palace, by lift"

[params.homepage_meta_tags]
meta_description = "Shakthi Sangita Sabha is a 150-seat auditorium for Carnatic music kutcheris, Bharatanatyam arangetrams and classical arts in Valasaravakkam, Chennai, with tuned acoustics, hi-fi sound, HD recording and live streaming."
meta_og_title = "Shakthi Sangita Sabha"
meta_og_type = "website"
meta_og_url = "https://shakthisangitasabha.com/"

[[menu.main]]
name = "Home"
url = "/"
weight = 1

[[menu.main]]
name = "Events"
url = "/events/"
weight = 2

[[menu.main]]
name = "Shakthi Palace"
url = "https://shakthipalace.com"
weight = 3
[menu.main.params]
external = true

[[menu.main]]
name = "Contact"
url = "/#contact"
weight = 4

[permalinks]
events = "/events/:year/:slug/"

[imaging]
quality = 82
[imaging.exif]
includeFields = ""
disableLatLong = true
